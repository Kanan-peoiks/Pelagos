services:
  - type: web
    name: seasentry-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        # seasentry.tech@gmail.com was disabled by Google on 2026-09-12
        # (flagged as bot-like activity during SMTP/2FA testing; appeal in
        # progress) and is left out of the active list below on purpose.
        # Once it's restored, add it back as a second admin email:
        #   value: seasentry.tech@proton.me,seasentry.tech@gmail.com
        value: seasentry.tech@proton.me
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: seasentry.tech@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://seasentry.vercel.app
      - key: REQUIRE_ADMIN_2FA
        # Off until the SMTP sender account is confirmed working again —
        # otherwise admin login would depend on an email that can't be sent.
        # Once SMTP is restored/replaced, flip this to "true" (env var only,
        # no redeploy of code needed) to turn the built 2FA flow back on.
        value: "false"

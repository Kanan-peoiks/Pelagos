services:
  - type: web
    name: seasentry-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        # seasentry.tech@gmail.com was disabled by Google on 2026-09-12
        # (flagged as bot-like activity during SMTP/2FA testing) and was
        # restored on 2026-09-14 — added back below as a second admin email.
        value: seasentry.tech@proton.me,seasentry.tech@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: seasentry.tech@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://seasentry.vercel.app
      - key: REQUIRE_ADMIN_2FA
        # Gmail was restored 2026-09-14 but its SMTP send hasn't been tested
        # yet (deliberately — to avoid tripping Google's bot-abuse flag
        # again). Leave this "false" until a real send is verified working;
        # then flip to "true" (env var only, no redeploy needed) to turn the
        # built 2FA flow back on.
        value: "false"
      - key: SLACK_WEBHOOK_URL
        # Blank = Slack alerts on new HIGH-risk incidents are skipped. Set
        # this in the Render dashboard once a workspace webhook exists
        # (never in this file — treated as a secret via sync: false).
        sync: false
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
